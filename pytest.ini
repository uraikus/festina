[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .

# No `-n` here on purpose. See scripts/run_tests.sh, which runs the
# bootstrap differential in parallel and everything else serially, and
# decisions.md #344 for why the split is drawn there rather than
# turning parallelism on for the whole suite.
#
# `pytest tests/` still works and is still serial, which is what you
# want when reading a failure. `pytest tests/test_bootstrap_canary.py
# -n auto --dist worksteal` is the one worth remembering by hand: that
# file is 83% of the suite's wall time on its own.
